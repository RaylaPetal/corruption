name: Build Corruption

on:
  push:
    branches: [ main ]
    # The release workflow commits repo.json to main; that alone needs no build.
    paths-ignore: [ 'repo.json' ]
  pull_request:
    branches: [ main, master ]

jobs:

  build:
    runs-on: windows-2022

    env:
      Solution_Name: Corruption

    steps:
    - name: Checkout
      uses: actions/checkout@v5
      with:
        submodules: recursive

    - name: Install .NET
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: 10.0.x

    - name: Download Dalamud
      run: |
        Invoke-WebRequest -Uri https://goatcorp.github.io/dalamud-distrib/latest.zip -OutFile latest.zip
        Expand-Archive -Force latest.zip "$env:AppData\XIVLauncher\addon\Hooks\dev"

    - name: Build with dotnet
      run: dotnet build Corruption.slnx --configuration Release

    - name: Test
      run: dotnet test --project Corruption.Tests/Corruption.Tests.csproj --configuration Release

    - name: Store artifacts
      uses: actions/upload-artifact@v4
      with:
        name: Corruption
        path: .\Corruption\bin\x64\Release\Corruption\*
        if-no-files-found: error
        retention-days: 1
